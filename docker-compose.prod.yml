# A local rehearsal of a production deploy, not a production topology.
#
# It runs the real image with Production settings so the startup checks, the
# security headers and the SPA hosting can all be exercised before any of it
# reaches a server. A real deployment uses a managed database and takes its
# secrets from the platform rather than from a compose file.
#
#   export DOMAIN=raidthepantry.ca
#   export ACME_EMAIL=you@example.com
#   export JWT_SIGNING_KEY="$(openssl rand -base64 32)"
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm api --migrate
#   docker compose -f docker-compose.prod.yml up -d
#   # https://<DOMAIN>, once the DNS A record points at this host
#
# On a bare OCI VM this is the whole public-facing stack: Caddy terminates TLS
# with a certificate it obtains from Let's Encrypt itself, and proxies to the
# api container over the internal network.
#
# Caddy is the only hop, so the default ForwardLimit of 1 is correct — see
# Program.cs. It is also the only container with a published port: the api
# binds 127.0.0.1 so it is reachable over SSH for a health check and from
# nowhere else.

name: recipefinder-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: recipefinder-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipefinder
      POSTGRES_USER: recipeapi
      # Local rehearsal only. A real deployment does not keep this in a file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rehearsal-only}
    volumes:
      - recipe-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipeapi -d recipefinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipefinder-api
    restart: unless-stopped
    environment:
      # Double underscore is the nesting separator for environment
      # configuration: ConnectionStrings__Postgres binds ConnectionStrings:Postgres.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=recipefinder;Username=recipeapi;Password=${POSTGRES_PASSWORD:-rehearsal-only}"

      # ":?" fails the run with this message rather than starting on a key
      # nobody chose. Outside Development a missing key is already fatal, but
      # failing here says why in one line.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY, e.g. export JWT_SIGNING_KEY=\"$(openssl rand -base64 32)\"}"

      # StartupChecks rejects the built-in default, so the crawler cannot go out
      # anonymous. No ":-" fallback: the caddy service below already fails the
      # whole command when DOMAIN is unset, and a fallback here would only ever
      # supply a value that is wrong anyway.
      Scraping__UserAgent: "RecipeFinderBot/1.0 (+https://${DOMAIN}/about)"

      # Caddy is the terminator in this topology and sets X-Forwarded-For /
      # X-Forwarded-Proto on every request it proxies, so this must be true —
      # false here would make every caller's rate-limit partition collapse
      # into Caddy's own address instead of the real client.
      Hosting__BehindReverseProxy: "true"
    # Bound to loopback only, not published to the host's public interface.
    # Caddy reaches this container over the internal compose network by
    # service name; 127.0.0.1:8080 stays available for a health check run
    # from inside the VM (curl over SSH) without opening it to the internet.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # The bulk crawler. Same image as the api, different entry point.
  #
  # Under a profile so `up` never starts it: these are one-shot commands, not a
  # long-running service, and a crawler that began fetching the moment the stack
  # came up is not what anyone wants.
  #
  #   docker compose -f docker-compose.prod.yml run --rm worker scrape /crawl/urls.txt
  #   docker compose -f docker-compose.prod.yml run --rm worker promote [--repromote]
  #   docker compose -f docker-compose.prod.yml run --rm worker status
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    # Its own subdirectory in the image — both projects ship an appsettings.json
    # and cannot share a publish directory. See the Dockerfile.
    entrypoint: ["dotnet", "worker/RecipeApi.Worker.dll"]
    command: ["status"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=recipefinder;Username=recipeapi;Password=${POSTGRES_PASSWORD:-rehearsal-only}"
      Scraping__UserAgent: "RecipeFinderBot/1.0 (+https://${DOMAIN}/about)"

      # Never true here. The crawl reaches whatever the URL list names, and
      # loopback from inside this container is the container itself.
      Scraping__AllowLoopbackHosts: "false"

      # ParserVersion is deliberately NOT set here. It belongs to the build, not
      # the deployment: the image's appsettings.json states which parser
      # generation its own code is, and environment beats appsettings, so a
      # default in this file would silently stamp promoted rows with a version
      # the running parser is not. To re-transform after a normalizer change,
      # raise it in appsettings.json and rebuild. For a one-off, override the
      # single run instead of this file:
      #   docker compose -f docker-compose.prod.yml run --rm \
      #     -e Scraping__ParserVersion=5 worker promote --repromote
    volumes:
      # A directory rather than ./urls.txt directly: bind-mounting a file that
      # does not exist yet makes Docker silently create a *directory* in its
      # place, and the failure that follows points nowhere near the cause.
      - ./crawl:/crawl:ro
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: recipefinder-caddy
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN, e.g. export DOMAIN=raidthepantry.ca}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL so Let's Encrypt can warn you about expiry}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

      # Load-bearing, not incidental. This holds the ACME account key and every
      # issued certificate. Lose it and Caddy re-requests from scratch; do that
      # a few times in a week and Let's Encrypt's duplicate-certificate rate
      # limit locks you out for days. `docker compose down` keeps it;
      # `down -v` does not.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

volumes:
  recipe-prod-pgdata:
  caddy-data:
  caddy-config:
