<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <!--
    Hand-drawn ingredient doodles, used as a tiled background texture behind the
    hero banner. Strokes are white so the tile can sit on the orange gradient and
    be dimmed to taste with a single `opacity` in CSS — an external SVG used as a
    background-image cannot inherit `currentColor`, so the colour is baked in and
    the opacity is the only knob.

    Lives in public/ rather than src/assets/ on purpose: Vite resolves a relative
    url() against the filesystem, and the "#" in this checkout's "C#" directory
    truncates that path and fails the build. An absolute public path is passed
    through untouched.

    The tile repeats. Every icon sits inside the 400x260 bounds except the chilli
    at each side: that one is drawn twice, exactly 400 apart, so the half clipped
    off the right edge of one tile completes the half clipped off the left edge
    of the next. Without it the empty gutter at the seam reads as a faint grid.

    Rows are inset ~20px from the top and ~37px from the bottom. Flush against
    the edges the hero slices the top row of icons clean in half, which reads as
    a rendering accident rather than a pattern bleeding off the edge.
  -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Tomato -->
    <g transform="translate(16, 24) rotate(-8, 29, 36)">
      <path d="M29 16 C15 16 6 27 7 38 C8 50 18 56 29 56 C40 56 50 50 51 38 C52 27 43 16 29 16 Z"/>
      <path d="M29 16 L29 7"/>
      <path d="M29 15 C24 11 19 10 15 11"/>
      <path d="M29 15 C34 11 39 10 43 11"/>
      <path d="M29 16 C25 19 21 21 17 21"/>
      <path d="M29 16 C33 19 37 21 41 21"/>
    </g>

    <!-- Chilli. The path starts and ends at the tip so the two edges meet in a
         sharp corner there; drawn as a rounded teardrop it reads as a balloon. -->
    <g transform="translate(118, 22) rotate(10, 23, 32)">
      <path d="M24 58 C14 48 12 32 18 18 C20 13 25 12 28 17 C34 27 35 43 29 52 C27 55 26 57 24 58 Z"/>
      <path d="M22 15 C20 10 19 7 16 4"/>
      <path d="M11 6 C15 2 21 4 22 9"/>
    </g>

    <!-- Garlic -->
    <g transform="translate(214, 26) rotate(-6, 25, 32)">
      <path d="M25 10 C17 22 8 30 10 43 C12 55 38 55 40 43 C42 30 33 22 25 10 Z"/>
      <path d="M25 12 C21 25 19 39 21 53"/>
      <path d="M25 12 C29 25 31 39 29 53"/>
      <path d="M25 10 L25 3"/>
    </g>

    <!-- Carrot -->
    <g transform="translate(312, 20) rotate(12, 26, 36)">
      <path d="M13 26 C21 20 31 20 39 26 C36 42 30 58 26 70 C22 58 16 42 13 26 Z"/>
      <path d="M19 34 L25 32"/>
      <path d="M22 44 L28 42"/>
      <path d="M24 54 L29 52"/>
      <path d="M22 24 C18 15 14 9 10 5"/>
      <path d="M26 23 C26 14 26 8 26 3"/>
      <path d="M30 24 C34 15 38 9 42 5"/>
    </g>

    <!-- Herb sprig. Leaves are almonds pointed at both ends — small closed loops
         cluster into something that reads as a flower instead. -->
    <g transform="translate(52, 158) rotate(-9, 24, 34)">
      <path d="M24 60 C25 44 26 28 27 12"/>
      <path d="M27 10 C22 15 22 21 26 26 C31 21 32 15 27 10 Z"/>
      <path d="M26 26 C18 26 10 22 7 17 C13 16 22 19 26 26 Z"/>
      <path d="M27 25 C35 25 43 21 46 16 C40 15 31 18 27 25 Z"/>
      <path d="M25 41 C17 41 10 37 7 33 C13 32 21 34 25 41 Z"/>
      <path d="M26 40 C34 40 41 36 44 32 C38 31 30 33 26 40 Z"/>
    </g>

    <!-- Lemon slice -->
    <g transform="translate(152, 166)">
      <circle cx="26" cy="26" r="21"/>
      <circle cx="26" cy="26" r="16"/>
      <path d="M29 26 L41 26"/>
      <path d="M27.5 28.6 L33.5 39"/>
      <path d="M24.5 28.6 L18.5 39"/>
      <path d="M23 26 L11 26"/>
      <path d="M24.5 23.4 L18.5 13"/>
      <path d="M27.5 23.4 L33.5 13"/>
    </g>

    <!-- Onion. Tapered neck and short lower layer lines; full-height symmetric
         stripes on a round body read as a watermelon. -->
    <g transform="translate(248, 160) rotate(7, 26, 36)">
      <path d="M26 12 C24 16 22 18 20 19 C12 23 8 33 10 43 C12 54 19 60 26 60 C33 60 40 54 42 43 C44 33 40 23 32 19 C30 18 28 16 26 12 Z"/>
      <path d="M18 34 C20 46 22 54 25 59"/>
      <path d="M34 34 C32 46 30 54 27 59"/>
      <path d="M26 12 C25 7 24 4 22 1"/>
      <path d="M26 60 L26 63"/>
    </g>

    <!-- Pot -->
    <g transform="translate(330, 170) rotate(-4, 31, 26)">
      <path d="M10 20 L13 42 C13 46 20 48 31 48 C42 48 49 46 49 42 L52 20"/>
      <path d="M5 20 L57 20"/>
      <path d="M7 22 C1 24 1 32 8 32"/>
      <path d="M55 22 C61 24 61 32 54 32"/>
      <path d="M23 13 C20 9 26 7 23 3"/>
      <path d="M39 13 C36 9 42 7 39 3"/>
    </g>

    <!-- Seam chilli: same shape drawn 400 apart so the two clipped halves meet. -->
    <g transform="translate(-24, 102) rotate(20, 23, 32)">
      <path d="M24 58 C14 48 12 32 18 18 C20 13 25 12 28 17 C34 27 35 43 29 52 C27 55 26 57 24 58 Z"/>
      <path d="M22 15 C20 10 19 7 16 4"/>
      <path d="M11 6 C15 2 21 4 22 9"/>
    </g>
    <g transform="translate(376, 102) rotate(20, 23, 32)">
      <path d="M24 58 C14 48 12 32 18 18 C20 13 25 12 28 17 C34 27 35 43 29 52 C27 55 26 57 24 58 Z"/>
      <path d="M22 15 C20 10 19 7 16 4"/>
      <path d="M11 6 C15 2 21 4 22 9"/>
    </g>

  </g>
</svg>
