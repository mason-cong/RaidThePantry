services:
  postgres:
    image: postgres:16-alpine
    container_name: recipefinder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipefinder
      POSTGRES_USER: recipeapi
      POSTGRES_PASSWORD: localdev
    ports:
      # Host port 5433, not 5432: this machine already runs a local Postgres bound
      # to 127.0.0.1:5432, which wins when a client resolves "localhost" and would
      # otherwise shadow this container.
      - "5433:5432"
    volumes:
      # Named volume, so `docker compose down` does not discard the database.
      # Use `docker compose down -v` when you deliberately want a clean slate.
      - recipe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipeapi -d recipefinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recipe-pgdata:
